<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Language" content="en" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Sets the `.dark` class before first paint, on every page (logged in or
      not), so the app never flashes the wrong theme. Mirrors ThemeProvider's
      own resolution: an explicit stored choice wins, otherwise the OS/browser
      preference decides.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var isDark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/src/assets/favicon.svg" />
    <!-- env:conf -->
    <!-- require('utils/analytics/head.html') -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
