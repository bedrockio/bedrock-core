name: API Schema

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: api-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      hasChanges: ${{ steps.filter.outputs.api_count > 0 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50 # v2.11.1
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'

  diff:
    if: ${{ needs.changes.outputs.hasChanges == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - changes
    permissions:
      contents: read
      pull-requests: write
    services:
      mongo:
        image: mongo:8.0.9
        ports:
          - 27017:27017
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Fetch OpenAPI definition from master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          path: master
          sparse-checkout: services/api/openapi.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26.x
          cache: pnpm
          cache-dependency-path: services/api/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: services/api
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI definition
        working-directory: services/api
        run: pnpm docs:generate

      - name: Verify committed definition is up to date
        working-directory: services/api
        run: |
          git diff --exit-code openapi.json || (echo "::error::OpenAPI definition is out of date. Run 'pnpm docs:generate' in services/api and commit the result." && exit 1)

      # Fork PRs get a read-only token, so they can't be commented on.
      - name: Notify
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        timeout-minutes: 5
        with:
          script: |
            const tag = '<!-- api-schema:notification -->';
            const { diffSpecs } = require('./services/api/scripts/docs/diff.js');

            // Compares the committed definition on the branch against master.
            const diff = diffSpecs('master/services/api/openapi.json', 'services/api/openapi.json');
            const body = [tag, '# API Changes', '', ...diff].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // 41898282 is the ID of the `github-actions` user
            const existing = comments.find((comment) => comment.user.id === 41898282 && comment.body.includes(tag));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
