name: API
on:
  push:
    branches: [master]
    paths: ["services/api/**"]
  pull_request:
    branches: [master]
    paths: ["services/api/**"]

jobs:
  api:
    name: Test and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/api
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: services/api/package.json
          cache: true
          cache_dependency_path: services/api/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint .

      - name: Run Tests
        run: pnpm test --silent
